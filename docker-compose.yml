services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: derivzero
      PGDATABASE: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./postgres/02_init_views.sql:/docker-entrypoint-initdb.d/02_init_views.sql
      - ./postgres/03_seed_users.sql:/docker-entrypoint-initdb.d/03_seed_users.sql
      - ./postgres/04_set_passwords.sh:/docker-entrypoint-initdb.d/04_set_passwords.sh
    networks:
      - prem_network

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYMENT: onprem
    ports:
      - "8501:8501"
    volumes:
      - ./dev_env:/dev_env
    depends_on:
      - postgres
    networks:
      - prem_network

  dev_env:
    build:
      context: ./dev_env
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYMENT: onprem
    volumes:
      - ./dev_env:/dev_env
    depends_on:
      - postgres
    networks:
      - prem_network

networks:
  prem_network:
    driver: bridge

volumes:
  postgres_data:
